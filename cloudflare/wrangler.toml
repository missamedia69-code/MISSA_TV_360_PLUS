# Projet Cloudflare Pages « missatv » : le site (copié depuis site/ par le workflow dans
# public/) et l'API d'activation (functions/), avec la base D1 « missatv ».
# Le workflow .github/workflows/site-cloudflare.yml remplace DATABASE_ID par l'identifiant
# réel de la base (créée automatiquement à la première publication).
name = "missatv"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "missatv"
database_id = "DATABASE_ID"
