name: MISSA TV 360 CI

on:
  push:
    branches:
      - branding-miissa-tv-360
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: missa-tv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android prerelease debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and compile Android debug APK
        run: ./gradlew :app:testPrereleaseDebugUnitTest :app:assemblePrereleaseDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: missa-tv-360-prerelease-debug
          path: app/build/outputs/apk/prerelease/debug/*.apk
          if-no-files-found: error
          retention-days: 7
