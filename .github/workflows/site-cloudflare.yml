name: Site vitrine (Cloudflare Pages)

# Publie le dossier site/ sur Cloudflare Pages (adresse *.pages.dev), en plus de GitHub
# Pages : certains opérateurs bloquent les adresses github.io, Cloudflare passe partout et a
# des serveurs en Afrique.
#
# Prérequis, une seule fois (voir docs/SITE_ET_VERSIONS.md) : deux secrets du dépôt
#   CLOUDFLARE_API_TOKEN   clé « Edit Cloudflare Workers » + permissions Cloudflare Pages et D1 (Edit)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
# Le projet Cloudflare « missatv » est créé automatiquement à la première publication.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT: missatv

jobs:
  deploy:
    name: Publier le site sur Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets Cloudflare
        id: secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning title=Cloudflare non configuré::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site sur Cloudflare."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Créer le projet Cloudflare s'il n'existe pas
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Projet $PROJECT déjà présent."
          else
            npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Publier
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)
          echo "### Site publié sur Cloudflare" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresse : https://$PROJECT.pages.dev (version : $URL)" >> "$GITHUB_STEP_SUMMARY"
