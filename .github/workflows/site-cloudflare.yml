name: Site vitrine (Cloudflare Pages)

# Publie le dossier site/ sur Cloudflare Pages (adresse *.pages.dev), en plus de GitHub
# Pages : certains opérateurs bloquent les adresses github.io, Cloudflare passe partout et a
# des serveurs en Afrique.
#
# Publie aussi l'API d'activation (cloudflare/functions, adresse /api/...) et sa base D1
# « missatv » (créée automatiquement, tables dans cloudflare/schema.sql).
# Paiements KPay, secrets facultatifs du dépôt, recopiés sur Cloudflare à chaque publication :
#   KPAY_API_KEY, KPAY_SECRET_KEY, KPAY_WEBHOOK_SECRET, MISSA_ADMIN_TOKEN
# Variable du dépôt (onglet Variables) : MISSA_LICENCE_ENFORCED = 1 pour activer le blocage
# après l'essai de 24 h dans l'application. Sans elle, l'application reste libre.
#
# Prérequis, une seule fois (voir docs/SITE_ET_VERSIONS.md) : deux secrets du dépôt
#   CLOUDFLARE_API_TOKEN   clé « Edit Cloudflare Workers » + permissions Cloudflare Pages et D1 (Edit)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
# Le projet Cloudflare « missatv » est créé automatiquement à la première publication.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'cloudflare/**'
      # Fichiers lus par l'application au démarrage, recopiés sur le site (voir « Publier »).
      - 'tv/chaines.m3u'
      - 'game/catalogue.json'
      - 'extensions/config.json'
      # Jeux : copiés dans le stockage Cloudflare R2 (voir « Jeux sur R2 »).
      - 'game/rom/**'
      - 'game/neogeo/**'
      - '.github/workflows/site-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT: missatv

jobs:
  deploy:
    name: Publier le site sur Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets Cloudflare
        id: secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning title=Cloudflare non configuré::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site sur Cloudflare."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # Deux versions : pour savoir si les jeux ont changé depuis la publication précédente.
          fetch-depth: 2

      - name: Set up Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Créer le projet Cloudflare s'il n'existe pas
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Projet $PROJECT déjà présent."
          else
            npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Base de données D1
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(npx --yes wrangler@3 d1 list --json | jq -r '.[] | select(.name=="missatv") | .uuid' | head -n 1)
          if [[ -z "$DB_ID" ]]; then
            npx --yes wrangler@3 d1 create missatv
            DB_ID=$(npx --yes wrangler@3 d1 list --json | jq -r '.[] | select(.name=="missatv") | .uuid' | head -n 1)
          fi
          if [[ -z "$DB_ID" ]]; then
            echo "::error::Impossible de créer ou de trouver la base D1 missatv (permission D1 Edit de la clé ?)"
            exit 1
          fi
          sed -i "s/DATABASE_ID/$DB_ID/" cloudflare/wrangler.toml
          npx --yes wrangler@3 d1 execute missatv --remote --file=cloudflare/schema.sql

      - name: Secrets de paiement
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          KPAY_API_KEY: ${{ secrets.KPAY_API_KEY }}
          KPAY_SECRET_KEY: ${{ secrets.KPAY_SECRET_KEY }}
          KPAY_WEBHOOK_SECRET: ${{ secrets.KPAY_WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ secrets.MISSA_ADMIN_TOKEN }}
          LICENCE_ENFORCED: ${{ vars.MISSA_LICENCE_ENFORCED }}
        run: |
          set -euo pipefail
          for NAME in KPAY_API_KEY KPAY_SECRET_KEY KPAY_WEBHOOK_SECRET ADMIN_TOKEN LICENCE_ENFORCED; do
            VALUE="${!NAME:-}"
            if [[ -n "$VALUE" ]]; then
              printf '%s' "$VALUE" | npx --yes wrangler@3 pages secret put "$NAME" --project-name="$PROJECT" >/dev/null
              echo "$NAME : envoyé"
            else
              echo "$NAME : absent (ignoré)"
            fi
          done

      # Jeux sur Cloudflare R2 (10 Go gratuits, téléchargements gratuits). Prérequis, une fois :
      # activer R2 sur le compte Cloudflare et donner à CLOUDFLARE_API_TOKEN la permission
      # « Workers R2 Storage : Edit ». Sans cela, cette étape ne fait rien et l'application
      # continue de télécharger les jeux sur GitHub.
      - name: Jeux sur R2
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -uo pipefail
          BUCKET=missatv-jeux
          if ! npx --yes wrangler@3 r2 bucket list > r2.log 2>&1; then
            echo "::warning title=R2 non disponible::Activez R2 sur Cloudflare et ajoutez la permission R2 à la clé : les jeux restent servis par GitHub."
            cat r2.log
            exit 0
          fi
          if ! grep -q "$BUCKET" r2.log; then
            npx --yes wrangler@3 r2 bucket create "$BUCKET" || { echo "::warning::Seau $BUCKET non créé"; exit 0; }
            FIRST=1
          fi
          # Relie le seau aux Functions du site (adresse /jeux/...).
          printf '\n[[r2_buckets]]\nbinding = "JEUX"\nbucket_name = "%s"\n' "$BUCKET" >> cloudflare/wrangler.toml
          # Envoi des jeux : tous au premier passage ou sur demande manuelle, sinon ceux qui ont changé.
          if [[ "${FIRST:-0}" == "1" || "${{ github.event_name }}" == "workflow_dispatch" ]] || ! git rev-parse -q HEAD~1 >/dev/null; then
            FILES=$(find game/rom game/neogeo -type f \( -name '*.neo' -o -name '*.zip' \) 2>/dev/null)
          else
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- game/rom game/neogeo | grep -E '\.(neo|zip)$' || true)
          fi
          for F in $FILES; do
            KEY="${F#game/}"
            if npx --yes wrangler@3 r2 object put "$BUCKET/$KEY" --file "$F" --content-type application/octet-stream --remote; then
              echo "Envoyé : $KEY"
            else
              echo "::warning::Envoi impossible : $KEY (l'application le prendra sur GitHub)"
            fi
          done

      - name: Publier
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          cp -r site cloudflare/public
          # Fichiers de démarrage de l'application : servis par Cloudflare (serveurs en Afrique),
          # GitHub reste la source en secours. Même chemin que dans le dépôt.
          # Les jeux (game/rom, plus de 25 Mo) restent sur GitHub : limite de Cloudflare Pages.
          for F in tv/chaines.m3u game/catalogue.json extensions/config.json; do
            if [[ -f "$F" ]]; then
              mkdir -p "cloudflare/public/$(dirname "$F")"
              cp "$F" "cloudflare/public/$F"
              echo "Recopié : $F"
            fi
          done
          cd cloudflare
          npx --yes wrangler@3 pages deploy --project-name="$PROJECT" --branch=main --commit-dirty=true | tee ../deploy.log
          cd ..
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)
          echo "### Site publié sur Cloudflare" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresse : https://$PROJECT.pages.dev (version : $URL)" >> "$GITHUB_STEP_SUMMARY"
