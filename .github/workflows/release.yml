name: Publier une version (APK)

# Construit l'APK « stable » signé et le publie dans GitHub Releases.
# Le site vitrine pointe automatiquement sur l'APK de la dernière version.
#
# Déclenchement : pousser un tag de version, par exemple
#   git tag v4.8.0 && git push origin v4.8.0
# ou lancer le workflow à la main (onglet Actions) en donnant le numéro.
#
# Prérequis (une seule fois, voir docs/SITE_ET_VERSIONS.md) : quatre secrets du dépôt
#   MISSA_KEYSTORE_BASE64, MISSA_KEYSTORE_PASSWORD, MISSA_KEY_ALIAS, MISSA_KEY_PASSWORD
# La même clé doit servir pour toutes les versions : sinon les utilisateurs ne peuvent pas
# installer la mise à jour par-dessus l'ancienne. Sans ces secrets, le workflow s'arrête
# au lieu de publier un APK signé avec une clé jetable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version à publier (ex. 4.8.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_NAME: MISSA-TV-360-PLUS.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Numéro de version invalide : $TAG (attendu : v4.8.0)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clé de signature
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MISSA_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error title=Clé de signature absente::Ajoutez les secrets MISSA_KEYSTORE_BASE64, MISSA_KEYSTORE_PASSWORD, MISSA_KEY_ALIAS et MISSA_KEY_PASSWORD (voir docs/SITE_ET_VERSIONS.md)."
            exit 1
          fi
          # build.gradle.kts lit la clé dans ce dossier (signingConfig « prerelease »).
          mkdir -p "$HOME/work/_temp/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/work/_temp/keystore/missa.keystore"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable release APK
        shell: bash
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.MISSA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.MISSA_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.MISSA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStableRelease --stacktrace
          APK=$(ls app/build/outputs/apk/stable/release/*.apk | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "::error::Aucun APK produit"
            exit 1
          fi
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Vérifier la signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_NAME" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::L'APK est signé avec la clé de debug : publication annulée."
            exit 1
          fi

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MISSA TV 360 PLUS ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          body: |
            ## Installer
            Téléchargez **${{ env.APK_NAME }}** ci-dessous, ou depuis le site :
            https://missatv.pages.dev/

            Pour vérifier le fichier, comparez son empreinte SHA-256 avec celle du fichier
            `${{ env.APK_NAME }}.sha256`.
