name: Publier une version (APK)

# Construit l'APK « stable » signé et le publie dans GitHub Releases.
# Le site vitrine pointe automatiquement sur l'APK de la dernière version.
#
# Déclenchement : pousser un tag de version, par exemple
#   git tag v4.8.0 && git push origin v4.8.0
# ou lancer le workflow à la main (onglet Actions) en donnant le numéro.
#
# Prérequis (une seule fois, voir docs/SITE_ET_VERSIONS.md) : quatre secrets du dépôt
#   MISSA_KEYSTORE_BASE64, MISSA_KEYSTORE_PASSWORD, MISSA_KEY_ALIAS, MISSA_KEY_PASSWORD
# La même clé doit servir pour toutes les versions : sinon les utilisateurs ne peuvent pas
# installer la mise à jour par-dessus l'ancienne. Sans ces secrets, le workflow s'arrête
# au lieu de publier un APK signé avec une clé jetable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version à publier (ex. 4.9.1) : le même que versionName dans gradle/libs.versions.toml'
        required: true
      nouveautes:
        description: 'Nouveautés affichées dans la fenêtre de mise à jour (séparez les points par ; )'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_NAME: MISSA-TV-360-PLUS.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Numéro de version invalide : $TAG (attendu : v4.8.0)"
            exit 1
          fi
          # L'application compare son numéro (versionName) à l'étiquette : s'ils diffèrent, les
          # utilisateurs se verraient proposer la même mise à jour sans fin.
          NAME=$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [[ "v$NAME" != "$TAG" ]]; then
            echo "::error::L'étiquette $TAG ne correspond pas à versionName ($NAME) dans gradle/libs.versions.toml."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clé de signature
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MISSA_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error title=Clé de signature absente::Ajoutez les secrets MISSA_KEYSTORE_BASE64, MISSA_KEYSTORE_PASSWORD, MISSA_KEY_ALIAS et MISSA_KEY_PASSWORD (voir docs/SITE_ET_VERSIONS.md)."
            exit 1
          fi
          # build.gradle.kts lit la clé dans ce dossier (signingConfig « prerelease »).
          mkdir -p "$HOME/work/_temp/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/work/_temp/keystore/missa.keystore"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable release APK
        shell: bash
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.MISSA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.MISSA_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.MISSA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStableRelease --stacktrace
          APK=$(ls app/build/outputs/apk/stable/release/*.apk | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "::error::Aucun APK produit"
            exit 1
          fi
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Vérifier la signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_NAME" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::L'APK est signé avec la clé de debug : publication annulée."
            exit 1
          fi

      - name: Notes de version
        shell: bash
        env:
          NOUVEAUTES: ${{ github.event.inputs.nouveautes }}
        run: |
          {
            echo "## Nouveautés"
            if [[ -n "${NOUVEAUTES// /}" ]]; then
              IFS=';' read -ra ITEMS <<< "$NOUVEAUTES"
              for item in "${ITEMS[@]}"; do
                item="$(echo "$item" | sed 's/^ *//;s/ *$//')"
                if [[ -n "$item" ]]; then echo "- $item"; fi
              done
            else
              echo "- Corrections et améliorations."
            fi
            echo
            echo "## Installer"
            echo "Téléchargez **$APK_NAME** ci-dessous, ou depuis le site :"
            echo "https://missatv.pages.dev/"
            echo
            echo "Pour vérifier le fichier, comparez son empreinte SHA-256 avec celle du fichier"
            echo "\`$APK_NAME.sha256\`."
          } > notes.md
          cat notes.md

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MISSA TV 360 PLUS ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          body_path: notes.md

      - name: Retirer les anciennes versions de l'application
        # Une seule version de l'application en ligne : la nouvelle. Les autres publications
        # (ROMs des jeux, étiquettes qui ne commencent pas par « v » + chiffre) ne sont pas touchées.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases" --paginate -q '.[] | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            if [[ "$tag" =~ ^v[0-9] && "$tag" != "$CURRENT" ]]; then
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
              echo "Version retirée : $tag"
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done
