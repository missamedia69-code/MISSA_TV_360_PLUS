name: Importer les ROMs KOF depuis Internet Archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-kof-roms
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Télécharger uniquement les 10 archives demandées
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/rom

          files=(
            kof94.zip
            kof95.zip
            kof96.zip
            kof97.zip
            kof98.zip
            kof99.zip
            kof2000.zip
            kof2001.zip
            kof2002.zip
            kof2003.zip
          )

          base_url="https://archive.org/download/neo-geo-mvs-romset"

          for file in "${files[@]}"; do
            destination="game/rom/$file"
            if [[ -e "$destination" ]]; then
              echo "Déjà présent, ignoré : $destination"
              continue
            fi

            echo "Téléchargement de $file"
            curl --fail --location --retry 3 --retry-delay 3 \
              "$base_url/$file" \
              --output "$destination"

            if ! unzip -tq "$destination"; then
              echo "Archive ZIP invalide : $file" >&2
              exit 1
            fi

            size=$(stat -c%s "$destination")
            if (( size > 100000000 )); then
              echo "Fichier supérieur à la limite GitHub de 100 Mo : $file ($size octets)" >&2
              exit 1
            fi
          done

      - name: Enregistrer les nouvelles archives dans Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/rom/kof94.zip game/rom/kof95.zip game/rom/kof96.zip game/rom/kof97.zip game/rom/kof98.zip game/rom/kof99.zip game/rom/kof2000.zip game/rom/kof2001.zip game/rom/kof2002.zip game/rom/kof2003.zip

          if git diff --cached --quiet; then
            echo "Aucune nouvelle archive à enregistrer."
            exit 0
          fi

          git commit -m "Ajoute les archives ROM King of Fighters sélectionnées"
          git push origin HEAD:main
