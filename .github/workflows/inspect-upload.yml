name: Inspect game upload (temporary)
on:
  push:
    branches: [arena/14cc0d36-missa-tv-360-plus]
    paths: [.github/workflows/inspect-upload.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download public release and inspect archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' > /tmp/report 2>&1
          import hashlib, os, urllib.request, zipfile
          base='https://github.com/${{ github.repository }}/releases/download/transfert-jeux-2026-11/'
          for name in ['mslugx.10.png','mslugx.11.png','mslugx.6.png','mslugx.7.png','Internet.Download.Manager.6.43.Build.11.rar']:
              print('\n###',name,flush=True)
              p='/tmp/'+name
              try:
                  urllib.request.urlretrieve(base+name,p)
                  print('Bytes:',os.path.getsize(p),'SHA256:',hashlib.sha256(open(p,'rb').read()).hexdigest(),flush=True)
                  with open(p,'rb') as f: print('Signature:',repr(f.read(16)),flush=True)
                  if zipfile.is_zipfile(p):
                      with zipfile.ZipFile(p) as z:
                          for e in z.infolist(): print(repr(e.filename),e.file_size,flush=True)
                          print('ZIP CRC error:', z.testzip(),flush=True)
                  else: print('Not ZIP',flush=True)
              except Exception as e: print('ERROR:',repr(e),flush=True)
              finally:
                  if os.path.exists(p): os.remove(p)
          PY
          gh pr comment 21 --body-file /tmp/report
