name: Lint report (temporary)

# Temporary: the runner logs are not reachable from the agent sandbox, so this
# workflow runs the same lint task as the PR check and posts the report as a
# comment on the pull request. Delete it once the report has been read.

on:
  push:
    branches: [arena/a3ecd62f-missa-tv-360-plus]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint
        continue-on-error: true
        run: ./gradlew :app:lint --continue --stacktrace 2>&1 | tail -n 150

      - name: Collect the report
        run: |
          {
            echo "### Lint report for $(git rev-parse --short HEAD)"
            echo
            echo '```text'
            found=0
            for f in $(find app/build -name "lint-results-*.txt" | sort); do
              if grep -q "Error" "$f"; then
                found=1
                echo "== $f"
                grep -n -B 3 -A 8 "Error" "$f" | head -n 120
                echo
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "no Error found in the lint reports"
            fi
            echo '```'
          } > /tmp/report.md
          wc -c /tmp/report.md

      - name: Post the report as a comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 30000 /tmp/report.md > /tmp/report-cut.md
          gh pr comment 7 --repo ${{ github.repository }} --body-file /tmp/report-cut.md
