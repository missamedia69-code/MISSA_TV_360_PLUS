name: Supprimer d'anciennes versions

# Supprime les versions (releases GitHub, brouillons compris) et leurs étiquettes, données à la main.
# La dernière version publiée n'est jamais supprimée : le site pointe dessus.
# Lancement : onglet Actions → « Supprimer d'anciennes versions » → Run workflow.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Étiquettes à supprimer, séparées par des espaces (ex. v4.8.0 v4.8.1)'
        required: true

permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSIONS: ${{ inputs.versions }}
    steps:
      - name: Supprimer
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          echo "Dernière version (conservée) : $latest"
          for tag in $VERSIONS; do
            if [ "$tag" = "$latest" ]; then
              echo "::warning::$tag est la dernière version : conservée"
              continue
            fi
            # Recherche dans la liste complète : les brouillons n'ont pas d'étiquette publiée
            # et « gh release view » ne les trouve pas.
            ids=$(gh api "repos/$GH_REPO/releases" --paginate -q ".[] | select(.tag_name == \"$tag\") | .id")
            if [ -z "$ids" ]; then
              echo "Introuvable : $tag"
              continue
            fi
            for id in $ids; do
              gh api -X DELETE "repos/$GH_REPO/releases/$id" && echo "Supprimée : $tag (version $id)"
            done
            # Étiquette Git associée, si elle existe.
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 && echo "Étiquette supprimée : $tag" || true
          done
          echo "Versions restantes :"
          gh release list --limit 50
